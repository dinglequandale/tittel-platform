# Typecheck, test and build on every push and pull request (OVERHAUL §5, Quality).
# The tests need no database: the smoke test boots the server without one and
# the rest are pure.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
