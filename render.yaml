# One Node web service: serves the built React/Vite SPA AND the Express API +
# WS channels (PLAN.md §4.1 — realtime rules out serverless hosting).
#
# Deploy: push this repo to GitHub, then on Render choose
#   New +  ->  Blueprint  ->  pick this repo. Render reads this file.
services:
  - type: web
    name: tittel-platform
    runtime: node
    # Free sleeps after 15 idle minutes, and the first visitor waits ~a minute
    # for it to wake. Switch to `starter` in the Render dashboard before the
    # first real lesson (docs/DEPLOY.md, step 4).
    plan: free
    # Render checks this before it sends traffic to a new deploy. It answers
    # 503 when the database is unreachable (apps/server/src/app.ts).
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    # Schema is idempotent (create-if-not-exists / alter-if-not-exists), so
    # it's safe to reapply it on every boot — keeps prod in sync without a
    # manual migration step (PLAN.md §9.5).
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase session-pooler Postgres URI — set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Supabase project URL — used server-side for JWKS verification.
      - key: SUPABASE_URL
        sync: false
      # Signs board host/guest tokens (PLAN.md §6.3). Render-generated so
      # tokens survive redeploys instead of invalidating on every restart.
      - key: BOARD_TOKEN_SECRET
        generateValue: true
      # Powers AI lesson-plan/worksheet import (POST /api/tutor/ai-import).
      # Optional: the endpoint 503s and the UI hides the feature if unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Server error reports. Optional: Sentry stays off when unset.
      - key: SENTRY_DSN
        sync: false
      # The CA that signed the database's certificate (Supabase: Database
      # settings -> SSL configuration), as PEM. When set, the certificate is
      # verified against it (apps/server/src/lib/dbSsl.ts). Optional.
      - key: DATABASE_CA_CERT
        sync: false
      # Public values baked into the client bundle at build time: a change
      # needs a redeploy (Manual Deploy -> Clear build cache & deploy).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Browser error reports. Optional.
      - key: VITE_SENTRY_DSN
        sync: false
      # Set to `on` to show "Sign in with Google", once Google is
      # enabled in Supabase. Leave unset until then.
      - key: VITE_GOOGLE_AUTH
        sync: false
